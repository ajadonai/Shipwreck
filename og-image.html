<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=DM+Sans:wght@500;600&family=DM+Mono:wght@500&display=swap');
  
  body {
    width: 1200px;
    height: 630px;
    background: #0d0d0d;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }
  
  /* Gradient accent bar */
  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, #ff6b6b, #ffb347, #5cc8ff, #69db7c, #b197fc);
  }
  
  /* Background number */
  .bg-number {
    position: absolute;
    top: 50%;
    right: 60px;
    transform: translateY(-50%);
    font-family: 'Fraunces', serif;
    font-size: 400px;
    font-weight: 400;
    color: #ffffff;
    opacity: 0.04;
    line-height: 1;
    letter-spacing: -0.05em;
  }
  
  /* Content */
  .content {
    position: relative;
    z-index: 1;
    padding: 80px 72px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #888;
    padding: 10px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    width: fit-content;
  }
  
  .badge::before {
    content: '';
    width: 8px;
    height: 8px;
    background: #ff6b6b;
    border-radius: 50%;
  }
  
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
  }
  
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 72px;
    font-weight: 400;
    color: #f5f5f5;
    line-height: 1.1;
    letter-spacing: -0.03em;
    max-width: 800px;
  }
  
  h1 em {
    font-style: italic;
    color: #ff6b6b;
    font-weight: 500;
  }
  
  .subtitle {
    font-size: 22px;
    color: #888;
    max-width: 600px;
    line-height: 1.5;
  }
  
  /* Stats row */
  .stats {
    display: flex;
    gap: 40px;
  }
  
  .stat {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .stat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  
  .stat-dot.security { background: #ff6b6b; }
  .stat-dot.infra { background: #ffb347; }
  .stat-dot.data { background: #5cc8ff; }
  .stat-dot.code { background: #69db7c; }
  .stat-dot.ux { background: #b197fc; }
  
  .stat-text {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  
  .stat-num {
    color: #999;
    font-weight: 600;
  }
  
  /* Footer */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .author {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  
  .author-avatar {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.1);
  }
  
  .author-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  
  .author-name {
    font-size: 16px;
    font-weight: 600;
    color: #f5f5f5;
  }
  
  .author-handle {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: #666;
  }
  
  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: #444;
    letter-spacing: 0.02em;
  }
  
  .logo span {
    color: #ff6b6b;
  }
</style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="bg-number">37</div>
  
  <div class="content">
    <div class="badge">Production Checklist</div>
    
    <div class="main">
      <h1>Mistakes your AI assistant <em>forgot to mention</em></h1>
      <p class="subtitle">The code review your Cursor never gave you. Security holes, infra failures, data risks.</p>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-dot security"></div>
          <span class="stat-text"><span class="stat-num">11</span> Security</span>
        </div>
        <div class="stat">
          <div class="stat-dot infra"></div>
          <span class="stat-text"><span class="stat-num">10</span> Infra</span>
        </div>
        <div class="stat">
          <div class="stat-dot data"></div>
          <span class="stat-text"><span class="stat-num">6</span> Data</span>
        </div>
        <div class="stat">
          <div class="stat-dot code"></div>
          <span class="stat-text"><span class="stat-num">7</span> Code</span>
        </div>
        <div class="stat">
          <div class="stat-dot ux"></div>
          <span class="stat-text"><span class="stat-num">3</span> UX</span>
        </div>
      </div>
    </div>
    
    <div class="footer">
      <div class="author">
        <img src="avatar.jpg" alt="" class="author-avatar">
        <div class="author-info">
          <span class="author-name">WLXAJ</span>
          <span class="author-handle">@WLXAJ</span>
        </div>
      </div>
      <div class="logo"><span>//</span> SHIPWRECKS</div>
    </div>
  </div>
</body>
</html>
